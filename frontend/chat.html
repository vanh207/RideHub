<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin nhắn &amp; Hỗ trợ — RideHub</title>
    <link rel="icon" type="image/png" href="assets/logo-rh.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      .chat-page-shell {
        max-width: 1140px;
        margin: 0 auto;
        padding: 104px 20px 64px;
      }
      .chat-layout {
        display: grid;
        grid-template-columns: 290px 1fr;
        gap: 18px;
        align-items: stretch;
      }
      @media (max-width: 820px) {
        .chat-layout {
          grid-template-columns: 1fr;
        }
      }
      .chat-sidebar {
        background: #ffffff;
        border: 1px solid #dcfce7;
        border-radius: 22px;
        box-shadow: 0 12px 32px rgba(21, 128, 61, 0.06);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-sidebar-head {
        padding: 16px 18px;
        border-bottom: 1px solid #f1f5f9;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 1rem;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chat-thread-list {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        max-height: 520px;
      }
      .chat-thread-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid transparent;
        background: transparent;
        text-align: left;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .chat-thread-item:hover {
        background: #f0fdf4;
      }
      .chat-thread-item.is-active {
        background: #ecfdf5;
        border-color: #86efac;
      }
      .chat-thread-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #22c55e, #15803d);
        color: #ffffff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 13px;
        flex-shrink: 0;
      }
      .chat-thread-meta {
        flex: 1;
        min-width: 0;
      }
      .chat-thread-name {
        font-size: 13.5px;
        font-weight: 700;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-thread-preview {
        font-size: 12px;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .chat-card {
        background: #ffffff;
        border: 1px solid #dcfce7;
        border-radius: 22px;
        box-shadow: 0 12px 32px rgba(21, 128, 61, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 580px;
      }
      .chat-card-header {
        background: linear-gradient(135deg, #15803d, #16a34a);
        color: #ffffff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .chat-messages-box {
        flex: 1;
        padding: 20px 24px;
        overflow-y: auto;
        max-height: 460px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f8fafc;
      }
      .chat-msg {
        max-width: 78%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .chat-msg--user {
        align-self: flex-end;
        background: #16a34a;
        color: #ffffff;
        border-bottom-right-radius: 4px;
      }
      .chat-msg--bot {
        align-self: flex-start;
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
      }
      .chat-quick-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 24px;
        background: #ffffff;
        border-top: 1px solid #f1f5f9;
      }
      .chat-quick-chip {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid #bbf7d0;
        background: #f0fdf4;
        color: #15803d;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .chat-quick-chip:hover {
        background: #dcfce7;
      }
      .chat-input-bar {
        display: flex;
        gap: 10px;
        padding: 14px 24px;
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
      }
      .chat-input-bar input {
        flex: 1;
        padding: 11px 16px;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        outline: none;
      }
      .chat-input-bar input:focus {
        border-color: #16a34a;
      }
    </style>
  </head>
  <body>
    <header id="mainNavbar" class="navbar is-scrolled">
      <div class="container navbar-inner">
        <a href="index.html" class="brand-logo">
          <img src="assets/logo-rh.png" alt="RideHub" style="height:36px;width:auto;object-fit:contain;" />
          <span>RideHub</span>
        </a>
        <nav class="nav-links" aria-label="Điều hướng chính"></nav>
        <div class="nav-actions">
          <button id="hamburgerBtn" class="hamburger-btn" aria-label="Mở menu" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
          </button>
        </div>
      </div>
    </header>
    <div id="mobileDrawer" class="mobile-drawer" aria-hidden="true"></div>

    <main class="chat-page-shell">
      <div class="chat-layout">
        <aside class="chat-sidebar" aria-label="Lịch sử trò chuyện">
          <div class="chat-sidebar-head">
            <span>Lịch sử chat</span>
          </div>
          <div id="chatThreadList" class="chat-thread-list"></div>
        </aside>

        <div class="chat-card">
        <div class="chat-card-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <div id="chatPartnerAvatar" hidden style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.5);display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;">GR</div>
            <div>
              <h1 id="chatHeaderTitle" style="margin:0;font-family:var(--font-display);font-size:1.25rem;color:#ffffff;">Tin nhắn &amp; Trợ lý Hỗ trợ RideHub</h1>
              <div id="chatHeaderSub" style="font-size:12.5px;opacity:0.9;margin-top:2px;">Kết nối trực tiếp API Chatbot AI, tra cứu chính sách, xe trống &amp; hỗ trợ vận hành 24/7</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="chatEscalateBtn" type="button" class="btn btn-soft" style="min-height:36px;padding:6px 12px;font-size:12.5px;">Gặp nhân viên hỗ trợ</button>
            <button id="chatResetBtn" type="button" class="btn btn-soft" style="min-height:36px;padding:6px 12px;font-size:12.5px;">Làm mới phiên</button>
          </div>
        </div>

        <div id="chatMessagesBox" class="chat-messages-box"></div>

        <div class="chat-quick-bar">
          <button type="button" class="chat-quick-chip" data-prompt="Chính sách đặt cọc và hoàn tiền khi hủy đơn như thế nào?">Chính sách cọc &amp; hoàn tiền</button>
          <button type="button" class="chat-quick-chip" data-prompt="Tìm giúp tôi xe máy điện còn trống tại TP.HCM">Tìm xe còn trống</button>
          <button type="button" class="chat-quick-chip" data-prompt="Kiểm tra trạng thái đơn đặt xe của tôi">Tra cứu đơn của tôi</button>
          <button type="button" class="chat-quick-chip" data-prompt="Quy trình giao nhận xe 4 bước gồm những gì?">Quy trình giao nhận 4 bước</button>
        </div>

        <form id="chatForm" class="chat-input-bar">
          <input id="chatInput" type="text" placeholder="Nhập câu hỏi hoặc nội dung cần hỗ trợ..." autocomplete="off" required />
          <button type="submit" class="btn btn-primary" style="min-height:42px;padding:0 20px;">Gửi</button>
        </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom-row">
          <div>© 2026 <strong>RideHub Technology JSC</strong>. Nền tảng chia sẻ &amp; thuê xe điện, xe tự lái Việt Nam.</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
            <a href="privacy-policy.html" style="color:#a7f3d0;text-decoration:none;">Chính sách bảo mật</a>
            <a href="index.html#storySection" style="color:#a7f3d0;text-decoration:none;">Điều khoản dịch vụ</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth-rbac.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const targetOwner = (params.get('owner') || '').trim();
        const targetInitials = (params.get('initials') || 'CX').trim();
        const targetAddr = (params.get('addr') || '').trim();

        const SESSION_KEY = targetOwner
          ? `ridehub_chat_session_owner_${targetOwner}`
          : 'ridehub_chat_session_id';
        const OWNER_HISTORY_KEY = targetOwner
          ? `ridehub_owner_chat_${targetOwner}`
          : '';

        const THREADS_META_KEY = 'ridehub_chat_threads_meta';
        const threadListEl = document.getElementById('chatThreadList');

        const saveThreadMeta = (ownerName, initials, addr) => {
          if (!ownerName) return;
          try {
            const meta = JSON.parse(localStorage.getItem(THREADS_META_KEY) || '{}');
            meta[ownerName] = { initials: initials || 'CX', addr: addr || '' };
            localStorage.setItem(THREADS_META_KEY, JSON.stringify(meta));
          } catch (_) {}
        };
        if (targetOwner) saveThreadMeta(targetOwner, targetInitials, targetAddr);

        const renderSidebarThreads = () => {
          if (!threadListEl) return;
          let metaMap = {};
          try { metaMap = JSON.parse(localStorage.getItem(THREADS_META_KEY) || '{}'); } catch (_) {}

          const ownerNames = new Set(Object.keys(metaMap));
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('ridehub_owner_chat_')) {
              ownerNames.add(k.slice('ridehub_owner_chat_'.length));
            }
          }
          if (targetOwner) ownerNames.add(targetOwner);

          const threads = [
            {
              key: '',
              name: 'Trợ lý AI RideHub',
              initials: 'RH',
              addr: '',
              preview: 'Hỗ trợ đặt xe, chính sách & vận hành 24/7',
            },
          ];

          ownerNames.forEach((name) => {
            const m = metaMap[name] || {};
            let preview = m.addr || 'Chủ xe đối tác RideHub';
            try {
              const msgs = JSON.parse(localStorage.getItem(`ridehub_owner_chat_${name}`) || '[]');
              if (Array.isArray(msgs) && msgs.length) {
                preview = msgs[msgs.length - 1].text || preview;
              }
            } catch (_) {}
            threads.push({
              key: name,
              name,
              initials: m.initials || name.slice(0, 2).toUpperCase(),
              addr: m.addr || '',
              preview,
            });
          });

          threadListEl.innerHTML = threads.map((t) => {
            const isActive = t.key === targetOwner;
            return `
              <button type="button" class="chat-thread-item${isActive ? ' is-active' : ''}" data-thread-owner="${t.key.replace(/"/g, '&quot;')}" data-thread-initials="${t.initials.replace(/"/g, '&quot;')}" data-thread-addr="${t.addr.replace(/"/g, '&quot;')}">
                <div class="chat-thread-avatar">${t.initials}</div>
                <div class="chat-thread-meta">
                  <div class="chat-thread-name">${t.name}</div>
                  <div class="chat-thread-preview">${t.preview}</div>
                </div>
              </button>
            `;
          }).join('');

          threadListEl.querySelectorAll('.chat-thread-item').forEach((btn) => {
            btn.addEventListener('click', () => {
              const o = btn.dataset.threadOwner || '';
              if (!o) {
                window.location.href = 'chat.html';
              } else {
                const ini = btn.dataset.threadInitials || 'CX';
                const ad = btn.dataset.threadAddr || '';
                window.location.href = `chat.html?owner=${encodeURIComponent(o)}&initials=${encodeURIComponent(ini)}&addr=${encodeURIComponent(ad)}`;
              }
            });
          });
        };

        renderSidebarThreads();

        if (targetOwner) {
          const avEl = document.getElementById('chatPartnerAvatar');
          const titleEl = document.getElementById('chatHeaderTitle');
          const subEl = document.getElementById('chatHeaderSub');
          const escBtn = document.getElementById('chatEscalateBtn');
          if (avEl) {
            avEl.hidden = false;
            avEl.style.display = 'grid';
            avEl.textContent = targetInitials;
          }
          if (titleEl) titleEl.textContent = `Chat với ${targetOwner}`;
          if (subEl) subEl.textContent = targetAddr ? `Địa chỉ bãi xe: ${targetAddr} • Phản hồi trực tiếp` : 'Trò chuyện trực tiếp với chủ xe RideHub';
          if (escBtn) escBtn.hidden = true;

          const quickBar = document.querySelector('.chat-quick-bar');
          if (quickBar) {
            quickBar.innerHTML = `
              <button type="button" class="chat-quick-chip" data-prompt="Xe của cửa hàng hiện còn trống lịch vào cuối tuần này không?">Hỏi lịch xe trống</button>
              <button type="button" class="chat-quick-chip" data-prompt="Chủ xe có hỗ trợ giao xe tận nơi không và phí bao nhiêu?">Hỏi giao xe tận nơi</button>
              <button type="button" class="chat-quick-chip" data-prompt="Khi nhận xe tôi cần chuẩn bị giấy tờ và tiền cọc thế nào?">Thủ tục nhận xe &amp; cọc</button>
            `;
          }
        }

        const getApiBase = () => {
          if (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL) {
            return CONFIG.API_BASE_URL.replace(/\/+$/, '') + '/chat';
          }
          return 'http://127.0.0.1:8000/api/chat';
        };
        const getSessionId = () => {
          let sid = localStorage.getItem(SESSION_KEY);
          if (!sid || !/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$/.test(sid)) {
            sid = (crypto && crypto.randomUUID)
              ? crypto.randomUUID()
              : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                  const r = (Math.random() * 16) | 0;
                  return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
                });
            localStorage.setItem(SESSION_KEY, sid);
          }
          return sid;
        };

        const box = document.getElementById('chatMessagesBox');
        const input = document.getElementById('chatInput');
        const form = document.getElementById('chatForm');
        let sessionId = getSessionId();

        const appendMsg = (sender, text) => {
          const div = document.createElement('div');
          div.className = 'chat-msg ' + (sender === 'user' ? 'chat-msg--user' : 'chat-msg--bot');
          div.textContent = text;
          box.appendChild(div);
          box.scrollTop = box.scrollHeight;
        };

        const saveOwnerMsg = (sender, text) => {
          if (!OWNER_HISTORY_KEY) return;
          try {
            const list = JSON.parse(localStorage.getItem(OWNER_HISTORY_KEY) || '[]');
            const arr = Array.isArray(list) ? list : [];
            arr.push({ sender, text });
            localStorage.setItem(OWNER_HISTORY_KEY, JSON.stringify(arr));
            renderSidebarThreads();
          } catch (_) {}
        };

        const headersWithAuth = () => {
          const token = window.AuthRBAC ? window.AuthRBAC.getToken() : '';
          return {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          };
        };

        const loadHistory = async () => {
          box.innerHTML = '';
          if (OWNER_HISTORY_KEY) {
            try {
              const saved = JSON.parse(localStorage.getItem(OWNER_HISTORY_KEY) || '[]');
              if (Array.isArray(saved) && saved.length) {
                saved.forEach((m) => appendMsg(m.sender === 'user' ? 'user' : 'bot', m.text));
                return;
              }
            } catch (_) {}
          }
          try {
            const res = await fetch(`${getApiBase()}/conversations/${sessionId}/messages`, {
              headers: headersWithAuth(),
              credentials: 'include',
            });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data.messages) && data.messages.length) {
                data.messages.forEach((m) => appendMsg(m.sender === 'USER' ? 'user' : 'bot', m.content));
                return;
              }
            }
          } catch (_) {}
          appendMsg(
            'bot',
            targetOwner
              ? `Xin chào! Tôi là ${targetOwner}. Bạn cần hỏi thêm về tình trạng xe, lịch nhận trả hay giao xe tận nơi?`
              : 'Xin chào! Tôi là trợ lý RideHub. Bạn cần hỗ trợ về đặt xe, chính sách hay vận hành hôm nay?'
          );
        };

        const sendMessage = async (text, escalate = false) => {
          const msg = (text || '').trim();
          if (!msg) return;
          appendMsg('user', msg);
          saveOwnerMsg('user', msg);
          input.value = '';
          try {
            const res = await fetch(`${getApiBase()}/message`, {
              method: 'POST',
              headers: headersWithAuth(),
              credentials: 'include',
              body: JSON.stringify({
                session_id: sessionId,
                message: targetOwner ? `[Chat với chủ xe ${targetOwner}] ${msg}` : msg,
                request_human_agent: escalate || Boolean(targetOwner),
              }),
            });
            const data = await res.json().catch(() => ({}));
            const reply = res.ok
              ? (data.reply || 'Đã tiếp nhận tin nhắn của bạn.')
              : (targetOwner
                  ? `Đã gửi tin nhắn tới ${targetOwner}. Chủ xe sẽ phản hồi bạn sớm nhất!`
                  : (data.detail || 'Hệ thống chat tạm thời gián đoạn, vui lòng thử lại.'));
            appendMsg('bot', reply);
            saveOwnerMsg('bot', reply);
          } catch (_) {
            const fallback = targetOwner
              ? `Đã ghi nhận tin nhắn gửi tới ${targetOwner}. Chủ xe sẽ phản hồi bạn sớm nhất!`
              : 'Không thể kết nối máy chủ chat. Vui lòng kiểm tra backend đang chạy.';
            appendMsg('bot', fallback);
            saveOwnerMsg('bot', fallback);
          }
        };

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          sendMessage(input.value);
        });

        document.querySelectorAll('.chat-quick-chip').forEach((btn) => {
          btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
        });

        document.getElementById('chatEscalateBtn')?.addEventListener('click', () => {
          sendMessage('Tôi muốn kết nối với nhân viên hỗ trợ trực tiếp.', true);
        });

        document.getElementById('chatResetBtn')?.addEventListener('click', async () => {
          if (OWNER_HISTORY_KEY) localStorage.removeItem(OWNER_HISTORY_KEY);
          try {
            await fetch(`${getApiBase()}/conversations/${sessionId}/reset`, {
              method: 'POST',
              headers: headersWithAuth(),
              credentials: 'include',
            });
          } catch (_) {}
          loadHistory();
        });

        document.getElementById('hamburgerBtn')?.addEventListener('click', () => {
          document.getElementById('hamburgerBtn')?.classList.toggle('is-open');
          document.getElementById('mobileDrawer')?.classList.toggle('is-open');
        });

        loadHistory();
      })();
    </script>
  </body>
</html>
