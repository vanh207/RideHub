<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ &amp; Đổi mật khẩu — RideHub</title>
  <link rel="icon" type="image/png" href="assets/logo-rh.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/pages/kyc.css" />
</head>

<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <header id="mainNavbar" class="navbar is-scrolled">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/logo-ridehub.svg" alt="RideHub" style="height:36px;width:auto;" />
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Trang chủ</a>
        <a href="vehicles.html" class="nav-link">Tìm &amp; Thuê xe</a>
        <a href="trips.html" class="nav-link">Chuyến đi</a>
        <a href="index.html#storySection" class="nav-link">Hướng dẫn thuê xe</a>
      </nav>
      <div class="nav-actions"></div>
    </div>
  </header>

  <main class="subpage-main" style="padding-top:104px;">
    <div class="container two-col-layout" style="max-width:1040px;grid-template-columns:270px 1fr;">
      <!-- Sidebar chức năng bên cạnh -->
      <aside class="panel-card"
        style="padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:92px;">
        <button type="button" class="user-menu-item prof-nav-btn is-active" data-prof-tab="profile"
          style="background:var(--green-100);color:var(--green-800);font-weight:800;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.5-3.8 4.8-5.5 8-5.5s6.5 1.7 8 5.5" />
          </svg>
          <span>Hồ sơ cá nhân</span>
        </button>
        <button type="button" class="user-menu-item prof-nav-btn" data-prof-tab="license">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M7 15h4M7 11h10" />
          </svg>
          <span>Giấy phép lái xe (GPLX)</span>
        </button>
        <button type="button" class="user-menu-item prof-nav-btn" data-prof-tab="favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M12 21s-7-4.5-9-9a5.5 5.5 0 0 1 9-5.5A5.5 5.5 0 0 1 21 12c-2 4.5-9 9-9 9z" />
          </svg>
          <span>Xe yêu thích</span>
        </button>
        <button type="button" class="user-menu-item prof-nav-btn" data-prof-tab="password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="3" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <span>Đổi mật khẩu</span>
        </button>
      </aside>

      <div>
        <!-- Hồ sơ cá nhân -->
        <div class="panel-card" data-prof-panel="profile">
          <h1 style="margin:0 0 16px;font-size:1.35rem;font-family:var(--font-display);">Hồ sơ cá nhân</h1>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;">
            <div class="avatar-circle-preview" id="profileAvatarPreview">U</div>
            <div style="flex:1;">
              <strong id="profileDisplayName" style="font-size:1.1rem;display:block;"></strong>
              <span id="profileDisplayEmail" style="font-size:13px;color:var(--text-muted);"></span>
            </div>
            <label class="btn btn-soft" style="cursor:pointer;">
              Đổi ảnh đại diện
              <input type="file" id="profileAvatarInput" accept="image/*" hidden />
            </label>
          </div>

          <form id="profileUpdateForm" novalidate>
            <div class="filter-group">
              <label class="filter-label" for="profNameIn">Họ và tên</label>
              <input id="profNameIn" class="form-input" type="text" required />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profEmailIn">Email</label>
              <input id="profEmailIn" class="form-input" type="email" required />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profPhoneIn">Số điện thoại</label>
              <input id="profPhoneIn" class="form-input" type="tel" required />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profAddrIn">Địa chỉ liên hệ</label>
              <input id="profAddrIn" class="form-input" type="text" placeholder="Nhập địa chỉ của bạn..." />
            </div>
            <button class="btn btn-primary btn-premium btn-shine" type="submit">Lưu hồ sơ</button>
          </form>
        </div>

        <!-- Giấy phép lái xe -->
        <div id="driver-license" class="panel-card" data-prof-panel="license" hidden>
          <div
            style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
            <h2 style="margin:0;font-size:1.25rem;font-family:var(--font-display);">Giấy phép lái xe (GPLX)</h2>
            <span id="licStatusBadge" class="status-badge status-badge--booked">Chưa nộp</span>
          </div>
          <form id="licenseForm" novalidate>
            <div class="filter-group">
              <label class="filter-label" for="profLicNum">Số giấy phép lái xe</label>
              <input id="profLicNum" class="form-input" type="text" placeholder="Nhập 12 chữ số giấy phép lái xe..." />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profLicName">Họ và tên</label>
              <input id="profLicName" class="form-input" type="text" placeholder="Nhập họ và tên trên GPLX..." />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profLicDob">Ngày sinh</label>
              <input id="profLicDob" class="form-input" type="date" />
            </div>
            <div class="filter-group">
              <label class="filter-label" for="profLicPhoto">Ảnh mặt trước GPLX</label>
              <label for="profLicPhoto"
                style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border-radius:14px;background:var(--bg-surface-soft);cursor:pointer;text-align:center;min-height:110px;">
                <div id="profLicPreview" style="font-size:13px;font-weight:700;color:var(--green-700);">Nhấn để tải ảnh
                  GPLX (JPG, PNG)</div>
                <input id="profLicPhoto" type="file" accept="image/*" hidden />
              </label>
            </div>
            <button class="btn btn-primary btn-premium btn-shine" type="submit">Lưu giấy phép lái xe</button>
          </form>
        </div>

        <!-- Xe yêu thích -->
        <div id="favorite-vehicles" class="panel-card" data-prof-panel="favorites" hidden>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h2 style="margin:0;font-size:1.25rem;font-family:var(--font-display);">Xe yêu thích</h2>
            <a href="vehicles.html" class="btn btn-soft" style="min-height:34px;padding:4px 12px;font-size:12px;">Khám
              phá thêm xe</a>
          </div>
          <div id="favVehiclesList" class="fleet-grid"
            style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr));"></div>
        </div>

        <!-- Đổi mật khẩu -->
        <div id="change-password" class="panel-card" data-prof-panel="password" hidden>
          <h2 style="margin:0 0 16px;font-size:1.25rem;font-family:var(--font-display);">Đổi mật khẩu</h2>
          <form id="changePassForm" novalidate>
            <div class="filter-group">
              <label class="filter-label" for="cpOldPass">Mật khẩu hiện tại</label>
              <input id="cpOldPass" class="form-input" type="password" placeholder="Nhập mật khẩu hiện tại..."
                required />
            </div>
            <div class="filter-group" style="margin-bottom:8px;">
              <label class="filter-label" for="cpNewPass">Mật khẩu mới</label>
              <input id="cpNewPass" class="form-input" type="password" placeholder="Nhập mật khẩu mới..." required />
            </div>
            <div style="margin-bottom:12px;">
              <div style="height:6px;border-radius:99px;background:var(--green-100);overflow:hidden;margin-bottom:6px;">
                <div id="cpStrengthBar"
                  style="height:100%;width:0%;background:#fb7185;transition:width 0.3s var(--ease-out),background-color 0.3s var(--ease-out);">
                </div>
              </div>
              <div style="font-size:12px;color:var(--text-muted);">Độ mạnh: <strong id="cpStrengthLabel">Chưa
                  nhập</strong></div>
            </div>
            <div class="filter-group" style="margin-bottom:6px;">
              <label class="filter-label" for="cpConfirmPass">Nhập lại mật khẩu mới</label>
              <input id="cpConfirmPass" class="form-input" type="password" placeholder="Nhập lại mật khẩu mới..."
                required />
            </div>
            <div id="cpMatchMsg" style="font-size:12px;font-weight:700;min-height:18px;margin-bottom:12px;"></div>
            <button class="btn btn-primary btn-premium btn-shine" type="submit">Cập nhật mật khẩu</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="js/effects.js"></script>
  <script src="js/auth-rbac.js"></script>
  <script>
    const switchProfileTab = (tabName) => {
      document.querySelectorAll('.prof-nav-btn').forEach((btn) => {
        const active = btn.dataset.profTab === tabName;
        btn.classList.toggle('is-active', active);
        btn.style.background = active ? 'var(--green-100)' : 'transparent';
        btn.style.color = active ? 'var(--green-800)' : 'var(--text-primary)';
        btn.style.fontWeight = active ? '800' : '600';
      });
      document.querySelectorAll('[data-prof-panel]').forEach((panel) => {
        panel.hidden = panel.dataset.profPanel !== tabName;
      });
    };

    document.querySelectorAll('.prof-nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchProfileTab(btn.dataset.profTab));
    });

    const syncFromHash = () => {
      if (location.hash === '#change-password') switchProfileTab('password');
      else if (location.hash === '#driver-license') switchProfileTab('license');
      else if (location.hash === '#favorite-vehicles') switchProfileTab('favorites');
      else switchProfileTab('profile');
    };
    window.addEventListener('hashchange', syncFromHash);
    syncFromHash();
    const renderUser = () => {
      const u = AuthRBAC.getCurrentUser();
      if (!u) return;
      document.getElementById('profileDisplayName').textContent = u.name;
      document.getElementById('profileDisplayEmail').textContent = `${u.email || ''} • ${u.phone}`;
      document.getElementById('profNameIn').value = u.name || '';
      document.getElementById('profEmailIn').value = u.email || '';
      document.getElementById('profPhoneIn').value = u.phone || '';
      document.getElementById('profAddrIn').value = u.address || '';
      const av = document.getElementById('profileAvatarPreview');
      if (u.avatarUrl) av.innerHTML = `<img src="${u.avatarUrl}" alt="Avatar">`;
      else av.textContent = (u.name || 'U').trim().slice(-1).toUpperCase();

      // License info
      document.getElementById('profLicNum').value = u.licenseNumber || '';
      document.getElementById('profLicName').value = u.licenseName || u.name || '';
      document.getElementById('profLicDob').value = u.licenseDob || u.dob || '';
      const licBadge = document.getElementById('licStatusBadge');
      if (u.licenseNumber && u.licenseName && u.licenseDob) {
        licBadge.className = 'status-badge status-badge--available';
        licBadge.textContent = u.kycStatus === 'approved' ? 'Đã xác thực' : 'Đang kiểm tra';
      } else {
        licBadge.className = 'status-badge status-badge--booked';
        licBadge.textContent = 'Chưa nộp';
      }
      if (u.licensePhotoUrl) {
        document.getElementById('profLicPreview').innerHTML = `<img src="${u.licensePhotoUrl}" alt="Ảnh GPLX" style="max-height:130px;border-radius:10px;">`;
      }
    };
    document.addEventListener('DOMContentLoaded', renderUser);

    // License photo & save
    let pendingLicPhoto = '';
    document.getElementById('profLicPhoto')?.addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        pendingLicPhoto = reader.result;
        document.getElementById('profLicPreview').innerHTML = `<img src="${pendingLicPhoto}" alt="Ảnh GPLX" style="max-height:130px;border-radius:10px;">`;
      };
      reader.readAsDataURL(f);
    });

    document.getElementById('licenseForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const numEl = document.getElementById('profLicNum');
      const nameEl = document.getElementById('profLicName');
      const dobEl = document.getElementById('profLicDob');
      let empty = false;
      [numEl, nameEl, dobEl].forEach((el) => {
        if (!el.value.trim()) { el.classList.add('is-input-error'); empty = true; }
        else el.classList.remove('is-input-error');
      });
      if (empty) { showRideHubToast('Vui lòng nhập số giấy phép, họ tên và ngày sinh!', true); return; }
      const patch = {
        licenseNumber: numEl.value.trim(),
        licenseName: nameEl.value.trim(),
        licenseDob: dobEl.value,
        kycStatus: 'pending'
      };
      if (pendingLicPhoto) patch.licensePhotoUrl = pendingLicPhoto;
      AuthRBAC.updateProfile(patch);
      renderUser();
      showRideHubToast('Đã lưu giấy phép lái xe và gửi kiểm tra!');
    });

    // Favorite Vehicles (hiển thị dạng thẻ xe + ấn trái tim để bỏ thích)
    const FAV_KEY = 'ridehub_favorite_vehicles';
    const DEFAULT_MOTO_SVG = '<svg viewBox="0 0 140 80"><path d="M28 48 C34 28,58 26,74 32 L96 22 L106 25 L94 48 Z" fill="#22c55e"/><circle cx="34" cy="57" r="14" fill="#132a1c"/><circle cx="34" cy="57" r="7" fill="#dcfce7"/><circle cx="102" cy="57" r="14" fill="#132a1c"/><circle cx="102" cy="57" r="7" fill="#dcfce7"/></svg>';
    const DEFAULT_CAR_SVG = '<svg viewBox="0 0 160 80"><path d="M18 52 C18 40,26 35,38 34 L54 18 C59 14,72 13,98 13 C112 13,121 20,129 33 L144 37 C150 39,152 44,152 52 L149 58 L18 58 Z" fill="#16a34a"/><path d="M58 20 L95 20 C106 20,114 25,120 33 L47 33 Z" fill="#ecfccb"/><circle cx="42" cy="59" r="12" fill="#132a1c"/><circle cx="42" cy="59" r="6" fill="#dcfce7"/><circle cx="122" cy="59" r="12" fill="#132a1c"/><circle cx="122" cy="59" r="6" fill="#dcfce7"/></svg>';
    const DEFAULT_FAVS = [
      { id: 'fav-1', name: 'VinFast Feliz S (2025)', specs: 'Số tự động • Điện • 2 chỗ', address: '45 Lý Tự Trọng, Quận 1, TP.HCM', price: '160.000đ/ngày', svg: DEFAULT_MOTO_SVG },
      { id: 'fav-2', name: 'VinFast VF 5 Plus (2025)', specs: 'Số tự động • Điện • 5 chỗ', address: '240 Võ Văn Ngân, Thủ Đức, TP.HCM', price: '750.000đ/ngày', svg: DEFAULT_CAR_SVG }
    ];
    const getFavs = () => {
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) { }
      localStorage.setItem(FAV_KEY, JSON.stringify(DEFAULT_FAVS));
      return [...DEFAULT_FAVS];
    };
    const renderFavs = () => {
      const list = getFavs();
      const wrap = document.getElementById('favVehiclesList');
      if (!list.length) {
        wrap.innerHTML = '<div style="grid-column:1/-1;padding:24px;border-radius:14px;background:var(--bg-surface-soft);text-align:center;font-size:13px;color:var(--text-muted);">Chưa có xe yêu thích nào. Hãy nhấn hình trái tim ở thẻ xe để thêm!</div>';
        return;
      }
      wrap.innerHTML = list.map((v) => {
        const chips = (v.specs || '').split('•').map((s) => `<span class="meta-chip">${s.trim()}</span>`).join('');
        const imgSvg = v.svg || ((v.specs || '').includes('2 chỗ') ? DEFAULT_MOTO_SVG : DEFAULT_CAR_SVG);
        return `
          <article class="vehicle-card spotlight-card" style="cursor:pointer;" onclick="if(!event.target.closest('.fav-heart-btn'))location.href='vehicles.html'">
            <div class="vehicle-card-media" style="height:150px;">
              ${imgSvg}
              <button type="button" class="fav-heart-btn is-liked" data-id="${v.id}" data-name="${v.name}" aria-label="Bỏ thích ${v.name}" title="Nhấn để bỏ thích">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-4.5-9-9a5.5 5.5 0 0 1 9-5.5A5.5 5.5 0 0 1 21 12c-2 4.5-9 9-9 9z"/></svg>
              </button>
            </div>
            <h3 style="margin:0;font-size:1.05rem;">${v.name}</h3>
            <div class="vehicle-meta-chips">${chips}</div>
            <div class="vehicle-address">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 1 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
              <span>${v.address}</span>
            </div>
            <div style="margin-top:auto;">
              <strong style="font-size:1.05rem;color:var(--green-700);">${v.price}</strong>
            </div>
          </article>
        `;
      }).join('');

      wrap.querySelectorAll('.fav-heart-btn').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const next = getFavs().filter((x) => x.id !== b.dataset.id && x.name !== b.dataset.name);
          localStorage.setItem(FAV_KEY, JSON.stringify(next));
          renderFavs();
          showRideHubToast(`Đã bỏ thích ${b.dataset.name}.`);
        });
      });
    };
    renderFavs();

    document.getElementById('profileAvatarInput')?.addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        AuthRBAC.updateProfile({ avatarUrl: reader.result });
        renderUser();
        showRideHubToast('Đã cập nhật ảnh đại diện!');
      };
      reader.readAsDataURL(f);
    });

    document.getElementById('profileUpdateForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const nameEl = document.getElementById('profNameIn');
      const emailEl = document.getElementById('profEmailIn');
      const phoneEl = document.getElementById('profPhoneIn');
      let empty = false;
      [nameEl, emailEl, phoneEl].forEach((el) => {
        if (!el.value.trim()) { el.classList.add('is-input-error'); empty = true; }
        else el.classList.remove('is-input-error');
      });
      if (empty) { showRideHubToast('Vui lòng điền đầy đủ thông tin!', true); return; }
      AuthRBAC.updateProfile({
        name: nameEl.value.trim(),
        email: emailEl.value.trim(),
        phone: phoneEl.value.trim(),
        address: document.getElementById('profAddrIn').value.trim()
      });
      renderUser();
      showRideHubToast('Đã lưu thông tin hồ sơ!');
    });

    const cpNew = document.getElementById('cpNewPass');
    const cpConf = document.getElementById('cpConfirmPass');
    const cpBar = document.getElementById('cpStrengthBar');
    const cpLbl = document.getElementById('cpStrengthLabel');
    const cpMatch = document.getElementById('cpMatchMsg');

    const checkCpMatch = () => {
      if (!cpConf.value) { cpMatch.textContent = ''; return false; }
      if (cpNew.value === cpConf.value) {
        cpMatch.textContent = 'Mật khẩu trùng khớp';
        cpMatch.style.color = 'var(--green-700)';
        return true;
      }
      cpMatch.textContent = 'Mật khẩu nhập lại chưa khớp';
      cpMatch.style.color = '#e11d48';
      return false;
    };

    cpNew?.addEventListener('input', () => {
      const v = cpNew.value;
      let s = 0;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v)) s++;
      if (/[a-z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      cpBar.style.width = (s / 4) * 100 + '%';
      cpBar.style.backgroundColor = s <= 2 ? '#fb7185' : s === 3 ? '#eab308' : '#22c55e';
      cpLbl.textContent = !v ? 'Chưa nhập' : s <= 2 ? 'Yếu' : s === 3 ? 'Trung bình' : 'Mạnh';
      checkCpMatch();
    });
    cpConf?.addEventListener('input', checkCpMatch);

    document.getElementById('changePassForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const oldEl = document.getElementById('cpOldPass');
      let empty = false;
      [oldEl, cpNew, cpConf].forEach((el) => {
        if (!el.value.trim()) { el.classList.add('is-input-error'); empty = true; }
        else el.classList.remove('is-input-error');
      });
      if (empty) { showRideHubToast('Vui lòng nhập đầy đủ các trường mật khẩu!', true); return; }
      if (!checkCpMatch()) { cpConf.classList.add('is-input-error'); showRideHubToast('Mật khẩu nhập lại chưa khớp!', true); return; }

      const res = AuthRBAC.changePassword(oldEl.value, cpNew.value);
      if (res.ok) {
        oldEl.value = ''; cpNew.value = ''; cpConf.value = '';
        cpBar.style.width = '0%'; cpLbl.textContent = 'Chưa nhập'; cpMatch.textContent = '';
        showRideHubToast('Đổi mật khẩu thành công!');
      } else {
        oldEl.classList.add('is-input-error');
        showRideHubToast(res.message, true);
      }
    });
  </script>
</body>

</html>
